:root{

--r:14px;
--sky1:#bcd8f0; --sky2:#e9f1f8; --tw1:#8fa3bb; --tw2:#a9b9cc; --tw3:#c3cfdc; --win:rgba(255,255,255,.55); --lit:#ffcf6e; --water:#a7c4dc; --ridge:#9fb7a6; --shade-top:rgba(233,241,248,.85); --shade-bot:rgba(243,245,248,.35);
}

--bg:#10141b; --surface:rgba(25,32,42,.88); --solid:#19202a; --veil-a:rgba(16,20,27,.35); --veil-b:rgba(16,20,27,.72); --veil-c:rgba(16,20,27,.92); --ily:#e6a35c; --ily-soft:#3a2a18; --surface-2:#232b37; --ink:#e9edf3; --muted:#9aa5b5; --line:#2e3846;
--plus:#4cc28b; --plus-soft:#173426; --minus:#f07373; --minus-soft:#3a1d1f; --wait:#e6b45a; --wait-soft:#3a2e17;
--yunho:#6c9cf5; --yunho-soft:#1b2a47; --chaewon:#ee7fbe; --chaewon-soft:#40203a; --on-kid:#10141b; --sky1:#0b1430; --sky2:#1d2b4d; --tw1:#25314a; --tw2:#2f3c58; --tw3:#3a4866; --win:rgba(150,170,210,.18); --lit:#ffc65c; --water:#14203a; --ridge:#1d2a3c; --shade-top:rgba(16,20,27,.8); --shade-bot:rgba(16,20,27,.5); color-scheme:dark}}
:root[data-theme="dark"]{
--bg:#10141b; --surface:rgba(25,32,42,.88); --solid:#19202a; --veil-a:rgba(16,20,27,.35); --veil-b:rgba(16,20,27,.72); --veil-c:rgba(16,20,27,.92); --ily:#e6a35c; --ily-soft:#3a2a18; --surface-2:#232b37; --ink:#e9edf3; --muted:#9aa5b5; --line:#2e3846;

body.k-chaewon{--kid:var(--chaewon); --kid-soft:var(--chaewon-soft)}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
padding-block:max(4px,env(safe-area-inset-top,0px)) calc(72px + env(safe-area-inset-bottom,0px))}

body{background:linear-gradient(180deg,var(--sky2) 0,var(--bg) 360px) no-repeat,var(--bg)}
.hero{position:relative;height:236px;display:flex;align-items:flex-start;justify-content:center;border-radius:22px;overflow:hidden;
background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 100%);border:1px solid var(--line)}
.hero .sky{position:absolute;left:0;bottom:0;width:100%;height:150px;display:block}
.hero{background-image:none;background-color:var(--sky1)!important;background:linear-gradient(180deg,var(--sky1) 0,var(--sky2) 100%)!important;isolation:isolate}
.hero img{display:none!important}
.sky .tag{fill:var(--lit)} .sky .tagt{fill:#1b1f27;font:700 6px var(--f-body)}
.sky .t1{fill:var(--tw1)} .sky .t2{fill:var(--tw2)} .sky .t3{fill:var(--tw3)} .sky .wn{fill:var(--win)}
.sky .lit{fill:var(--lit)} .sky .glow{fill:var(--lit);opacity:.35} .sky .rd{fill:var(--ridge)} .sky .gr{fill:var(--ridge);opacity:.75}
.sky .tr{fill:var(--plus);opacity:.55} .sky .cl{fill:#fff;opacity:.6} .sky .sun{fill:var(--lit);opacity:.85} .sky .lb{fill:var(--ink);opacity:.75;font:700 5.5px var(--f-body)}
.hero-in{position:relative;text-align:center;padding-top:18px;display:flex;flex-direction:column;align-items:center;gap:2px}
.hero .place{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--ink);opacity:.7}
.hero h1{font-size:34px;text-shadow:0 0 10px var(--sky2),0 0 3px var(--sky2)}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.month button{border:0;background:none;width:34px;height:34px;border-radius:50%;font-size:18px;color:var(--muted)}
.month button:disabled{opacity:.3;cursor:default}
.month span{font-weight:600;min-width:92px;text-align:center}
.modebar{display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:8px;font-size:13px;color:var(--muted)}

.av img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.ilyh{display:flex;align-items:center;justify-content:center;gap:8px}
.ilyh img{width:30px;height:30px;border-radius:50%;object-fit:cover;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.av.yunho{background:var(--yunho)} .av.chaewon{background:var(--chaewon)}
.kidbtn b{display:block;font-size:15px}
.kidbtn small{color:var(--muted);font-size:12px}
.kidbtn[aria-pressed="true"][data-kid="yunho"]{border-color:var(--yunho);background:var(--yunho-soft)}
.kidbtn[aria-pressed="true"][data-kid="chaewon"]{border-color:var(--chaewon);background:var(--chaewon-soft)}
.badge{position:absolute;top:-6px;right:-6px;background:var(--wait);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;display:grid;place-items:center;padding:0 6px}

.sum{background:var(--surface);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;align-items:center;gap:8px;border:1px solid var(--line);text-align:center}
.sum .big{font-family:var(--f-display);font-size:34px;line-height:1.05;color:var(--kid)}

.plus{color:var(--plus)} .minus{color:var(--minus)} .waitc{color:var(--wait)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);vertical-align:1px}
.pill.paid,.pill.ok{background:var(--plus-soft);color:var(--plus)}
.pill.wait{background:var(--wait-soft);color:var(--wait)}

.group{display:flex;flex-direction:column;gap:8px}
.stack{display:flex;flex-direction:column;gap:18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.rule{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 18px 12px;box-shadow:0 1px 2px rgba(20,30,50,.06),0 4px 12px rgba(20,30,50,.05);text-align:center;align-items:center;justify-content:center;display:flex;flex-direction:column;gap:4px;min-height:72px;position:relative}

.rule .ic svg{width:24px;height:24px}

.rule.p .a{color:var(--plus)} .rule.m .a{color:var(--minus)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}

.row .main{flex:1;min-width:0}

.row .sub{font-size:12px;color:var(--muted);overflow-wrap:anywhere}

.field{display:flex;flex-direction:column;gap:4px}

padding:6px max(16px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}

<script>
(() => {
const KIDS = [{id:"yunho",name:"서윤호",short:"윤호"},{id:"chaewon",name:"서채원",short:"채원"}];
const PARENTS = ["아빠","엄마"];
const DEFAULT_IMG = {};
const FRESH_MIN = 10;
const pad = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
let TODAY = ymd(new Date());
let THIS_MONTH = TODAY.slice(0,7);
const won = n => (n>0?"+":n<0?"−":"")+Math.abs(n).toLocaleString("ko-KR");
const krw = n => (n<0?"−":"")+Math.abs(n).toLocaleString("ko-KR")+"원";
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);
const WD = ["일","월","화","수","목","금","토"];

const ICON = {
check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
log:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>',
settle:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M7 15h3"/></svg>',
setup:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>'
};

/* ---------- local state ---------- */
const LS = {
get(k,d){ try{ const v=localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } },
set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
/* iPhone은 다른 사이트 안에 들어간 화면의 저장소를 앱을 닫을 때 지워요.
   그래서 로그인 정보를 바깥 페이지(github.io)에도 맡기고, 다음에 열 때 돌려받아요. */
const TOP_ORIGINS = ["https://friese8807.github.io"];
let topOrigin = null;
try{ const ao=location.ancestorOrigins; if(ao&&ao.length){ const o=ao[ao.length-1]; if(TOP_ORIGINS.includes(o)) topOrigin=o; } }catch(e){}
/* 구글 주소로 바로 열 때: 로그인 정보를 주소 끝(#)에 넣어 홈 화면 바로가기에 함께 저장돼요. */
const enc = o => { try{ return btoa(unescape(encodeURIComponent(JSON.stringify(o)))); }catch(e){ return ""; } };
const dec = t => { try{ return JSON.parse(decodeURIComponent(escape(atob(t)))); }catch(e){ return null; } };
function hashSave(){ try{ const h=window.google?.script?.history; if(!h) return; const a=LS.get("ycn-auth",null);
h.replace(null, {}, a&&a.who ? "u="+enc({auth:a,ui:LS.get("ycn-ui",{})}) : ""); }catch(e){} }
const topSave = () => { hashSave(); if(!topOrigin) return; try{ window.top.postMessage({ycn:"save",data:{auth:LS.get("ycn-auth",null),ui:LS.get("ycn-ui",{})}}, topOrigin); }catch(e){} };
const _set=LS.set, _del=LS.del;
LS.set=(k,v)=>{ _set(k,v); if(k==="ycn-auth"||k==="ycn-ui") topSave(); };
LS.del=(k)=>{ _del(k); if(k==="ycn-auth") topSave(); };
const saved = LS.get("ycn-ui", {});
const S = {
auth: LS.get("ycn-auth", null),
kid: saved.kid==="chaewon"?"chaewon":"yunho",
mode: saved.mode||null, self: saved.self||null,
month: THIS_MONTH, tab: saved.tab||"check",
pub: null, config: null, ent: {yunho:null, chaewon:null}, ledger: {},
adj: {}, confirm: null, editRule: null, busy:false, loadNote:"", loaded:false
};
function remember(){ LS.set("ycn-ui", {kid:S.kid,tab:S.tab,mode:S.mode,self:S.self}); }
function fixMode(){
if(!S.auth){ S.mode=null; return; }
if(S.auth.who!=="parent"){ S.mode="kid"; S.self=S.auth.who; S.kid=S.self; return; }
if(S.mode!=="kid" || !KIDS.some(k=>k.id===S.self)){ S.mode="parent"; S.self=null; }
}
fixMode();

/* ---------- server ---------- */
/* 홈 화면 앱(github.io)에서는 구글 서버와 데이터만 주고받아요. 서버가 아직 준비 안 됐으면 예전 방식(frame.html)으로 열어요. */
const EXEC_URL = "https://script.google.com/macros/s/AKfycbzhbaZtMcPyhMlsOBEt1cqps72dyTTdhso3vsjWXAA69xLrck1xABlOnCCfZMnQRISg/exec";
function apiFetch(body){
  return fetch(EXEC_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),redirect:"follow"})
    .then(r=>r.text()).then(t=>{ try{ return JSON.parse(t); }catch(e){ const err=new Error("noapi"); err.noapi=true; throw err; } });
}
/* 접속 기록용: 어떤 기기·방식으로 들어왔는지 */
const META=(()=>{ const u=navigator.userAgent||""; let dev="기타";
 if(/iPhone/.test(u)) dev="iPhone"; else if(/iPad/.test(u)||(/Macintosh/.test(u)&&navigator.maxTouchPoints>1)) dev="iPad"; else if(/Android/.test(u)) dev="Android"; else if(/Macintosh/.test(u)) dev="Mac"; else if(/Windows/.test(u)) dev="Windows";
 const v=(u.match(/OS (\d+)[_.]/)||[])[1]; if(v&&/iP/.test(dev)) dev+=" iOS "+v;
 let via="브라우저"; try{ if(new URLSearchParams(location.search).get("via")==="widget") via="위젯"; else if(navigator.standalone||matchMedia("(display-mode: standalone)").matches) via="홈화면 앱"; }catch(e){}
 return {dev, via}; })();
function call(action, payload={}){
return new Promise((resolve,reject)=>{
if(!window.google?.script?.run){ apiFetch(Object.assign({}, payload, {action, auth:S.auth, meta:META}))
  .then(res=>{ if(res&&res.ok) resolve(res.data); else reject(res||{code:"error",message:"처리하지 못했어요"}); })
  .catch(e=>{ if(e&&e.noapi&&!window.__fellback){ window.__fellback=1; location.replace("frame.html"); }
    reject({code:"network",message:"서버에 연결하지 못했어요. 잠시 후 다시 해주세요."}); }); return; }
google.script.run
.withSuccessHandler(res=>{ if(res&&res.ok) resolve(res.data); else reject(res||{code:"error",message:"처리하지 못했어요"}); })
.withFailureHandler(e=>reject({code:"network",message:"서버에 연결하지 못했어요. 잠시 후 다시 해주세요."}))
.api(Object.assign({}, payload, {action, auth:S.auth, meta:META}));
});
}
function onErr(e){
if(e?.code==="auth"&&S.auth&&!S.pinPending){ logout("다시 로그인해 주세요"); return; }
toast(e?.message||"처리하지 못했어요");
}

/* ---------- images (Drive → data URL, cached) ---------- */
const IMG = {};
let imgTimer=null;
function imgUrl(id, persist){
if(!id) return "";
if(IMG[id] && IMG[id]!=="loading") return IMG[id];
if(IMG[id]==="loading") return "";
const cached = persist ? LS.get("img:"+id, null) : null;
if(cached){ IMG[id]=cached; return cached; }
IMG[id]="loading";
call("image",{id}).then(d=>{ IMG[id]=d.url; if(persist) LS.set("img:"+id, d.url); clearTimeout(imgTimer); imgTimer=setTimeout(()=>{ if(!sheetOpen()) render(); applyBg(); },60); })
.catch(()=>{ IMG[id]="err:"; });
return "";
}
const okUrl = u => u && !u.startsWith("err:") ? u : "";
function photoFor(key){ // yunho | chaewon | ily | bg
const id = key==="ily" ? (S.config?.ily||S.pub?.ily) : key==="bg" ? (S.config?.bg||S.pub?.bg) : (S.config?.kids?.[key]?.photo || S.pub?.kids?.[key]?.photo);
return okUrl(imgUrl(id, true)) || DEFAULT_IMG[key] || "";
}
function applyBg(){ const u=photoFor("bg"); const im=$("bgimg"); if(im && u && im.src!==u) im.src=u; }

/* ---------- derived ---------- */
const kidName = id => S.config?.kids?.[id]?.name || S.pub?.kids?.[id]?.name || KIDS.find(k=>k.id===id)?.name || "";
const kidShort = id => KIDS.find(k=>k.id===id)?.short || "";
const avHtml = (id, size) => { const u=photoFor(id); return `<span class="av ${id}" ${size?`style="width:${size}px;height:${size}px;font-size:${Math.round(size/2.2)}px"`:""}>${u?`<img src="${esc(u)}" alt="">`:esc(kidShort(id).slice(0,1))}</span>`; };
const ilyHead = () => { const u=photoFor("ily"); return `<div class="ilyh">${u?`<img src="${esc(u)}" alt="일리">`:""}<h2>일리 돌봄</h2></div>`; };
const isKid = () => S.mode==="kid";
const curKid = () => isKid() ? S.self : S.kid;
const kidCfg = (k=curKid()) => S.config?.kids?.[k] || null;
const DEFAULT_BANK = {yunho:"카카오뱅크", chaewon:"토스뱅크"};
/* 토스 송금 화면을 받는 계좌·금액이 채워진 채로 열어요. 출금 계좌(기업은행)는 토스에서 골라요. */
function tossURL(ac, amount){ return "supertoss://send?bank="+encodeURIComponent(ac.bank||"")+"&accountNo="+encodeURIComponent(String(ac.no||"").replace(/[^0-9]/g,""))+"&amount="+Math.round(amount); }
const vacMonths = () => String(S.config?.vacMonths||"").split(/[^0-9]+/).filter(Boolean).map(Number);
function isVac(k=curKid(), month=S.month){ return (Number(kidCfg(k)?.baseVac)||0)>0 && vacMonths().includes(Number(month.slice(5,7))); }
function kidBase(k=curKid(), month=S.month){ const c=kidCfg(k)||{}; return isVac(k,month) ? Number(c.baseVac)||0 : Number(c.base)||0; }
const ledgerKey = (kid,month) => kid+"_"+month;
const isPaid = (k=curKid()) => !!S.ledger[ledgerKey(k,S.month)]?.paid;
const status = e => e.status || "ok";
const entries = (k=curKid()) => S.ent[k];
function addDays(date,n){ const d=new Date(date+"T00:00:00"); d.setDate(d.getDate()+n); return ymd(d); }
function weeksOf(month){ // 월~일 주, 목요일이 이 달에 있는 주
const out=[]; let mon=weekKey(month+"-01"); for(let i=0;i<6;i++){ if(addDays(mon,3).slice(0,7)===month) out.push(mon); mon=addDays(mon,7); } return out; }
function adjEntries(k){ const r=[]; for(const m of [monthAdd(S.month,-1),monthAdd(S.month,1)]) for(const e of (S.adj[m]?.ent||[])) if(e.kid===k&&status(e)==="ok") r.push(e); return r; }
function weekKey(date){ const d=new Date(date+"T00:00:00"); d.setDate(d.getDate()-((d.getDay()+6)%7)); return ymd(d); }
function bonusList(k=curKid()){
const es=(entries(k)||[]).filter(e=>status(e)==="ok"); const out=[]; const live=S.month===THIS_MONTH;
for(const b of S.config?.bonuses||[]){
if(b.off) continue; const amt=Number(b.amount)||0;
if(b.type==="noMinus"){
if(b.from && S.month<b.from) continue;
if(!es.length) continue; const ok=!es.some(e=>e.amount<0);
out.push({label:b.label,total:ok?amt:0,note:ok?(live?"지금까지 벌점 없음 · 말일까지 유지하면 지급":"달성"):"벌점이 있어 미달성"});
}else if(b.type==="weekly"){
const wk={}; for(const e of es) if(e.ruleId===b.ruleId) wk[weekKey(e.date)]=(wk[weekKey(e.date)]||0)+1;
if(b.per){ // 주 N회 이상이면 그 주 횟수 × per원 (최대 cap회), 주마다 따로 계산
const per=Number(b.per)||0, cap=Number(b.cap)||99, min=Number(b.min)||1; let tot=0, wkN=0;
for(const n of Object.values(wk)) if(n>=min){ tot+=Math.min(n,cap)*per; wkN++; }
const cur=wk[weekKey(TODAY)]||0;
out.push({label:b.label,total:tot,note:`주 ${min}회 이상이면 그 주 횟수 × ${Number(per).toLocaleString("ko-KR")}원 (최대 ${cap}회) · 달성 ${wkN}주`+(live?` · 이번 주 ${cur}회`+(cur>=min?` → ${(Math.min(cur,cap)*per).toLocaleString("ko-KR")}원`:` (${min-cur}회 더 하면 ${(min*per).toLocaleString("ko-KR")}원)`):"")});
continue; }
const weeks=Object.values(wk).filter(n=>n>=(Number(b.min)||1)).length; const cur=wk[weekKey(TODAY)]||0;
out.push({label:b.label,total:weeks*amt,note:`달성 ${weeks}주 × ${won(amt)}`+(live?` · 이번 주 ${cur}/${b.min}회`:"")});
}else if(b.type==="weeklyMiss"){
const amt2=Number(b.amounts?.[k]??b.amount)||0; const min=Number(b.min)||1; if(!amt2) continue;
const all=es.concat(adjEntries(k)).filter(e=>e.ruleId===b.ruleId);
let missed=0, cur=null, judged=0;
for(const mon of weeksOf(S.month)){
const sun=addDays(mon,6); const n=all.filter(e=>e.date>=mon&&e.date<=sun).length;
if(sun<TODAY){ judged++; if(n<min) missed++; } else if(mon<=TODAY) cur=n;
}
out.push({label:b.label,total:-missed*amt2,pen:true,note:`주 ${min}회 미만이면 주마다 ${won(-amt2)} · 지난 ${judged}주 중 미달 ${missed}주`+(cur!=null?` · 이번 주 ${cur}/${min}회`:"")});
}
}
return out;
}
function totals(k=curKid()){
let p=0,m=0,w=0,wn=0;
for(const e of entries(k)||[]){ const s=status(e);
if(s==="ok"){ if(e.amount>0)p+=e.amount; else m+=e.amount; }
else if(s==="pending"){ w+=e.amount; wn++; } }
const base = kidBase(k);
const bl=bonusList(k); const bo=bl.reduce((a,b)=>a+b.total,0); const bop=bl.filter(b=>b.total>0).reduce((a,b)=>a+b.total,0); const bon=bo-bop;
let pay = base+p+m+bo; const raw = pay;
if(S.config?.floorZero!==false && pay<0) pay=0;
return {p,m,base,pay,raw,w,wn,bo,bl,bop,bon};
}
const pendingCount = k => (S.ent[k]||[]).filter(e=>status(e)==="pending").length;
function monthAdd(k,d){ let [y,m]=k.split("-").map(Number); m+=d; while(m<1){m+=12;y--} while(m>12){m-=12;y++} return y+"-"+pad(m); }
const monthLabel = k => { const [y,m]=k.split("-"); return y+"년 "+Number(m)+"월"; };
function todayUsed(ruleId, k=curKid()){ return (S.ent[k]||[]).filter(e=>e.ruleId===ruleId && e.date===TODAY && status(e)!=="rejected").length; }
function tabsFor(){ return isKid()
? [["check","인증",ICON.cam],["log","기록",ICON.log],["settle","내 용돈",ICON.settle]]
: [["check","체크",ICON.check],["log","기록",ICON.log],["settle","정산",ICON.settle],["setup","설정",ICON.setup]]; }
const sheetOpen = () => !!$("layer").firstChild;

/* ---------- rule icons ---------- */
const RI = {
box:'<path d="M4 9h16v10H4z"/><path d="M3 5h18v4H3zM10 13h4"/>',
book:'<path d="M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/><path d="M4 20V5M8 7h7"/>',
pencil:'<path d="M4 20l4-1L19 8l-3-3L5 16z"/><path d="M14 7l3 3"/>',
recycle:'<path d="M9 4.5 12 3l3 1.5M12 3l-2.5 4.5M17.5 9l2.5 4.5-1.5 3M20 13.5h-5M6.5 9 4 13.5l1.5 3M4 13.5h5M8 20h8"/>',
bag:'<path d="M5 8h14l-1 12H6z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/>',
paw:'<circle cx="7" cy="10" r="1.7"/><circle cx="10.5" cy="6.5" r="1.7"/><circle cx="14.5" cy="6.5" r="1.7"/><circle cx="18" cy="10" r="1.7"/><path d="M8.5 17c0-3 1.8-5 3.5-5s3.5 2 3.5 5c0 2-1.8 2.2-3.5 2.2S8.5 19 8.5 17z"/>',
pad:'<rect x="4" y="4" width="16" height="16" rx="3"/><circle cx="10" cy="10" r="1.2"/><circle cx="14" cy="10" r="1.2"/><path d="M10 15c0-1.4.9-2.2 2-2.2s2 .8 2 2.2"/>',

/* ---------- photo helpers ---------- */
async function loadImage(file){
try{ return await createImageBitmap(file); }catch(e){}
return await new Promise((res,rej)=>{ const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=URL.createObjectURL(file); });
}
async function toJpeg(file, maxSide, stamp, square){
const img = await loadImage(file);
const w0=img.width||img.naturalWidth, h0=img.height||img.naturalHeight;
const c = document.createElement("canvas"); const g=c.getContext("2d");
if(square){ const side=Math.min(w0,h0); c.width=c.height=square; g.drawImage(img,(w0-side)/2,Math.max(0,(h0-side)/3),side,side,0,0,square,square); }
else{ const s=Math.min(1,maxSide/Math.max(w0,h0)); c.width=Math.round(w0*s); c.height=Math.round(h0*s); g.drawImage(img,0,0,c.width,c.height); }
if(stamp){ const fs=Math.max(16,Math.round(c.width/26)); const bh=Math.round(fs*1.9);
g.fillStyle="rgba(0,0,0,.55)"; g.fillRect(0,c.height-bh,c.width,bh);
g.fillStyle="#fff"; g.font=`600 ${fs}px "IBM Plex Sans KR",system-ui,sans-serif`; g.textBaseline="middle";
g.fillText(stamp, Math.round(fs*.6), c.height-bh/2, c.width-fs*1.2); }
return c.toDataURL("image/jpeg",.82);
}
async function hashFile(file){
try{ const d=await crypto.subtle.digest("SHA-256",await file.arrayBuffer());
return [...new Uint8Array(d)].slice(0,16).map(b=>b.toString(16).padStart(2,"0")).join(""); }catch(e){ return ""; }
}
function stampText(rule){ const n=new Date(); return `${n.getFullYear()}.${pad(n.getMonth()+1)}.${pad(n.getDate())} ${pad(n.getHours())}:${pad(n.getMinutes())} · ${kidName(curKid())} · ${rule.label}`; }

/* ---------- record sheet ---------- */
let pending = null;
function openSheet(rule){
const kid = isKid(); const needPhoto = kid && rule.photo!==false;
const def = S.month===THIS_MONTH ? TODAY : S.month+"-01";
const max = S.month===THIS_MONTH ? TODAY : ymd(new Date(Number(S.month.slice(0,4)),Number(S.month.slice(5,7)),0));
pending = {rule, file:null, hash:"", checks:null, needPhoto};
$("layer").innerHTML = `<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-label="${kid?"인증하기":"기록하기"}">
<div class="head"><b>${esc(rule.label)}</b><span class="num ${rule.amount>0?"plus":"minus"}" style="font-weight:700;font-size:18px">${won(rule.amount)}원</span></div>
${kid&&!needPhoto?`<p class="note" style="margin:0">이 항목은 사진 없이 보내요. 부모님이 확인하면 용돈에 더해져요.</p><ul class="checks" id="checks"></ul>`:kid?`<label class="cam" for="sFile" id="camBox">${ICON.cam}<span>여기를 눌러 지금 사진 찍기</span><small style="font-weight:400">${esc(rule.label)}한 모습이 보이게 찍어주세요</small></label>
<input id="sFile" type="file" accept="image/*" capture="environment" hidden><ul class="checks" id="checks"></ul>`
:`<div class="field"><label for="sDate">날짜</label><input class="inp" id="sDate" type="date" value="${def}" min="${S.month}-01" max="${max}"></div>`}
<div class="field"><label for="sMemo">메모 (선택)</label><input class="inp" id="sMemo" placeholder="${kid?"예: 놀이터까지 30분":"예: 저녁 산책 30분"}"></div>
${!kid?`<div class="field"><label>사진 (선택)</label><div class="inline"><img id="sPrev" alt="" hidden style="width:64px;height:64px;border-radius:10px;object-fit:cover"><label class="ib" for="sFile">사진 찍기/선택</label><input id="sFile" type="file" accept="image/*" hidden></div></div>`:""}
<button class="btn" id="sGo" ${kid?"disabled":""}>${kid?"부모님께 인증 보내기":`${esc(kidName(curKid()))} ${rule.amount>0?"상점":"벌점"} 기록하기`}</button>
<button class="btn ghost" data-close="1">닫기</button></div></div>`;
$("sGo").onclick = commit;
if(kid) renderChecks();
if($("sFile")) $("sFile").onchange = () => onPhoto($("sFile").files[0]);
}
function renderChecks(){
if(!pending || !$("checks")) return;
const c = pending.checks || {}; const u = todayUsed(pending.rule.id), mx = Number(pending.rule.max)||0;
const items = (pending.needPhoto?[["photo","사진 찍기",c.photo],["fresh",`방금 찍은 사진 (${FRESH_MIN}분 이내, 앨범 사진 불가)`,c.fresh],["dup","이전에 쓴 사진이 아님",c.dup]]:[]).concat([["limit",mx?`오늘 횟수 남음 (${u}/${mx}회)`:"오늘 횟수 제한 없음",mx?u<mx:true]]);
$("checks").innerHTML = items.map(([id,l,v])=>`<li class="${v===true?"y":v===false?"n":""}"><span class="ic">${v===true?"✓":v===false?"!":"·"}</span><span>${esc(l)}${v===false&&c[id+"Msg"]?`<br><small>${esc(c[id+"Msg"])}</small>`:""}</span></li>`).join("");
$("sGo").disabled = !items.every(i=>i[2]===true) || S.busy;
}
async function onPhoto(file){
if(!file || !pending) return;
if(!isKid()){ pending.file=file; const p=$("sPrev"); if(p){p.src=URL.createObjectURL(file); p.hidden=false;} return; }
const c = pending.checks = {};
c.photo = /^image\//.test(file.type) || /\.(jpe?g|png|heic|heif|webp)$/i.test(file.name||"");
if(!c.photo) c.photoMsg="사진 파일이 아니에요.";
const age = Date.now()-(file.lastModified||0);
c.fresh = !!file.lastModified && age>=-60000 && age<=FRESH_MIN*60000;
if(!c.fresh) c.freshMsg="앨범에 있던 사진은 안 돼요. 지금 바로 찍어주세요.";
const h = await hashFile(file); pending.hash=h;
const used = h && (S.ent[curKid()]||[]).some(e=>e.photoHash===h);
c.dup=!used; if(used) c.dupMsg="이미 인증에 쓴 사진이에요.";
pending.file = (c.photo&&c.fresh&&c.dup)?file:null;
const box=$("camBox"); if(box) box.innerHTML=`<img alt="찍은 사진" src="${URL.createObjectURL(file)}"><small>다시 찍으려면 눌러요</small>`;
renderChecks();
}
function closeSheet(){ $("layer").innerHTML=""; pending=null; }
async function commit(){
if(!pending || S.busy) return;
const kid=isKid(); const k=curKid(); const r=pending.rule;
const date = kid ? TODAY : ($("sDate").value || TODAY);
const memo = $("sMemo").value.trim().slice(0,200);
if(S.ledger[ledgerKey(k,date.slice(0,7))]?.paid){ toast("이미 정산된 달이에요"); return; }
if(kid && pending.needPhoto && !pending.file){ toast("사진 인증을 먼저 완료해 주세요"); return; }
S.busy=true; $("sGo").disabled=true; $("sGo").textContent=kid?"보내는 중…":"기록 중…";
try{
const photo = pending.file ? await toJpeg(pending.file, 1280, stampText(r)) : null;
await call("addEntry",{kid:k, ruleId:r.id, date, memo, photo, photoHash: kid?pending.hash:"", asKid: kid});
closeSheet();
toast(kid?"인증을 보냈어요. 부모님이 확인하면 반영돼요":`${kidName(k)} · ${r.label} ${won(r.amount)} 기록했어요`);
if(date.slice(0,7)!==S.month) S.month=date.slice(0,7);
await refresh();
}catch(e){ onErr(e); if($("sGo")){ $("sGo").disabled=false; $("sGo").textContent="다시 시도"; } }
finally{ S.busy=false; }
}
let tt; function toast(m){ clearTimeout(tt); let el=document.querySelector(".toast"); if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el);} el.textContent=m; tt=setTimeout(()=>el.remove(),2800); }

/* ---------- login / mode ---------- */
function openPin(title, onOk){
$("layer").innerHTML = `<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-label="${esc(title)}">
<div class="head"><b>${esc(title)}</b></div>
<input class="inp num" id="pinTry" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="숫자 비밀번호" style="font-size:22px;letter-spacing:.3em;text-align:center">
<p class="note" id="pinMsg"></p>
<button class="btn" id="pinGo" style="--kid:var(--ink);--on-kid:var(--bg)">확인</button>
<button class="btn ghost" data-close="1">닫기</button></div></div>`;
const go = async () => { const v=$("pinTry").value.trim(); if(!v) return; $("pinGo").disabled=true;
try{ await onOk(v); }catch(e){ if($("pinMsg")) $("pinMsg").textContent=e?.message||"확인하지 못했어요"; if($("pinTry")){ $("pinTry").value=""; $("pinTry").focus(); } }
finally{ if($("pinGo")) $("pinGo").disabled=false; } };
$("pinGo").onclick=go; $("pinTry").onkeydown=e=>{ if(e.key==="Enter") go(); };
setTimeout(()=>$("pinTry")?.focus(),50);
}
async function tryLogin(who, name, pin){
const prev=S.auth; S.auth={who, name: who==="parent"?name:kidName(who), pin:pin||""}; S.pinPending=true;
try{ await call("login"); }catch(e){ S.auth=prev; throw e; } finally{ S.pinPending=false; }
LS.set("ycn-auth", S.auth); S.mode=null; fixMode(); S.tab="check"; remember(); closeSheet();
$("loginArea").hidden=true; S.loaded=false; render(); await refresh();
if(who==="parent" && !S.config?.hasParentPin) toast("설정 탭에서 부모 비밀번호를 먼저 정해주세요");
}
function startLogin(who, name){
const needs = who==="parent" ? S.pub?.hasParentPin : S.pub?.kids?.[who]?.hasPin;
if(!needs){ tryLogin(who,name,"").catch(onErr); return; }
openPin(`${who==="parent"?name:kidName(who)} 비밀번호`, pin=>tryLogin(who,name,pin));
}
function logout(msg){
LS.del("ycn-auth"); S.auth=null; S.mode=null; S.self=null; S.config=null; S.ent={yunho:null,chaewon:null}; S.loaded=false; remember(); closeSheet();
render(); if(msg) toast(msg); boot();
}
function setMode(mode, self){
S.mode=mode; S.self=mode==="kid"?self:null; if(mode==="kid") S.kid=self;
S.tab="check"; S.confirm=null; S.editRule=null; remember(); closeSheet(); render(); document.getElementById("sc").scrollTo(0,0);
}
function openHandOver(){
$("layer").innerHTML = `<div class="scrim" data-close="1"><div class="sheet" role="dialog" aria-label="아이에게 넘겨주기">
<div class="head"><b>잠깐 아이에게 넘겨줄까요?</b></div>
<p class="note">아이 모드에서는 상점 항목만 사진으로 인증할 수 있고, 부모님 승인 후 반영돼요. 부모 모드로 돌아올 때 비밀번호가 필요해요.</p>
<div class="who">${KIDS.map(k=>`<button data-become="${k.id}">${avHtml(k.id)}${esc(kidName(k.id))}</button>`).join("")}</div>
<button class="btn ghost" data-close="1">닫기</button></div></div>`;
}
function backToParent(){
if(!S.config?.hasParentPin){ setMode("parent"); return; }
openPin("부모 비밀번호", async pin => {
const prev=S.auth; S.auth=Object.assign({},prev,{pin}); S.pinPending=true;
try{ await call("login"); LS.set("ycn-auth",S.auth); setMode("parent"); }catch(e){ S.auth=prev; throw e; } finally{ S.pinPending=false; }
});
}

/* ---------- data ---------- */
let loadSeq=0;
async function loadAdj(month){
if(!(S.config?.bonuses||[]).some(b=>b.type==="weeklyMiss"&&!b.off)) return;
for(const m of [monthAdd(month,-1),monthAdd(month,1)]){
if(m>THIS_MONTH) continue; const c=S.adj[m];
if(c && (c.busy || (m!==THIS_MONTH && Date.now()-c.at<300000) || (m===THIS_MONTH && Date.now()-c.at<30000))) continue;
S.adj[m]=Object.assign({ent:[]},c,{busy:true});
try{ const d=await call("load",{month:m}); S.adj[m]={ent:d.entries||[],at:Date.now()}; if(S.month===month && !sheetOpen()) render(); }
catch(e){ S.adj[m]=Object.assign({},c||{ent:[]},{at:Date.now()}); }
}
}
async function refresh(silent){
if(!S.auth) return;
const seq=++loadSeq; const month=S.month;
try{
const d = await call("load",{month});
if(seq!==loadSeq) return;
TODAY=d.today; THIS_MONTH=TODAY.slice(0,7);
S.config=d.config; S.ledger=d.ledger||{};
S.ent={yunho:[],chaewon:[]}; for(const e of d.entries||[]) (S.ent[e.kid] ||= []).push(e);
S.loaded=true; S.loadNote="";
loadAdj(month);
}catch(e){
if(seq!==loadSeq) return;
if(e?.code==="auth"){ logout("비밀번호가 바뀌었어요. 다시 로그인해 주세요"); return; }
S.loadNote=e?.message||"불러오지 못했어요"; if(!silent) toast(S.loadNote);
}
if(!sheetOpen()) render(); else if(isKid()) renderChecks();
}
async function boot(){
try{ const d=await call("boot"); S.pub=d.cfg; TODAY=d.today; THIS_MONTH=TODAY.slice(0,7); if(!S.auth) S.month=THIS_MONTH; }
catch(e){ S.loadNote=e?.message||"서버에 연결하지 못했어요"; if(!S.auth){ $("loginArea").innerHTML=`<div class="card empty">${esc(S.loadNote)}</div>`; return; } }
render();
}
async function act(promise, okMsg){ try{ await promise; if(okMsg) toast(okMsg); }catch(e){ onErr(e); } await refresh(true); }

/* ---------- events ---------- */
document.addEventListener("click", async ev => {
const b = ev.target.closest("button,[data-close]"); if(!b) return;
const d = b.dataset;
if(d.close!==undefined && ev.target===b){ closeSheet(); return; }
if(d.login){ startLogin(d.login, d.name); return; }
if(d.logout){ logout(); return; }
if(d.become){ setMode("kid", d.become); return; }
if(d.switch){ isKid()?backToParent():openHandOver(); return; }
if(d.kid && b.classList.contains("kidbtn")){ S.kid=d.kid; S.confirm=null; S.editRule=null; remember(); render(); return; }
if(d.tab){ S.tab=d.tab; S.confirm=null; S.editRule=null; remember(); render(); document.getElementById("sc").scrollTo(0,0); return; }
if(b.id==="mPrev"){ S.month=monthAdd(S.month,-1); S.ent={yunho:null,chaewon:null}; render(); refresh(); return; }
if(b.id==="mNext"){ if(S.month<THIS_MONTH){ S.month=monthAdd(S.month,1); S.ent={yunho:null,chaewon:null}; render(); refresh(); } return; }
if(d.rule){ const r=(kidCfg()?.rules||[]).find(x=>x.id===d.rule); if(r) openSheet(r); return; }
if(d.photo){ const u=okUrl(imgUrl(d.photo,false)); if(u) $("layer").innerHTML=`<div class="viewer" data-close="1"><img src="${esc(u)}" alt="인증 사진" data-close="1"></div>`; return; }
if(d.ask){ S.confirm={id:d.ask,kind:"del"}; render(); return; }
if(d.askrej){ S.confirm={id:d.askrej,kind:"reject"}; render(); setTimeout(()=>$("rjReason")?.focus(),30); return; }
if(d.cancel){ S.confirm=null; render(); return; }
if(d.approve){ b.disabled=true; await act(call("review",{id:d.approve,decision:"ok"}),"승인했어요"); return; }
if(d.reject){ const reason=($("rjReason")?.value||"").trim(); b.disabled=true; S.confirm=null; await act(call("review",{id:d.reject,decision:"rejected",reason}),"반려했어요"); return; }
if(d.del){ b.disabled=true; S.confirm=null; await act(call("deleteEntry",{id:d.del}),"삭제했어요"); return; }
if(d.pay){ const k=curKid(); const t=totals(k);
const lastD=new Date(Number(S.month.slice(0,4)),Number(S.month.slice(5,7)),0).getDate();
if(S.month===THIS_MONTH && Number(TODAY.slice(8))<lastD && !confirm(`아직 정산일(${Number(S.month.slice(5,7))}월 ${lastD}일) 전이에요.\n지금 ${kidName(k)}에게 ${krw(t.pay)} 지급 완료로 잠글까요?`)) return;
b.disabled=true;
await act(call("pay",{kid:k,month:S.month,summary:{base:t.base,plus:t.p,minus:t.m,bonus:t.bo,total:t.pay}}),`${kidName(k)} ${krw(t.pay)} 지급 완료`); return; }
if(d.unpay){ b.disabled=true; await act(call("unpay",{kid:curKid(),month:S.month}),"지급 취소했어요. 기록이 다시 열렸어요"); return; }
if(d.savepin){ const inp = d.savepin==="parent"?$("pinInp"):$("kidPinInp"); const v=inp.value.trim();
if(!/^\d{4,8}$/.test(v)){ toast("숫자 4~8자리로 정해주세요"); return; }
b.disabled=true;
try{ await call("setPin",{target:d.savepin,pin:v}); if(d.savepin==="parent"){ S.auth.pin=v; LS.set("ycn-auth",S.auth); } toast("비밀번호를 저장했어요"); }catch(e){ onErr(e); }
await refresh(true); return; }
if(d.clearpin){ b.disabled=true; await act(call("setPin",{target:d.clearpin,pin:""}),"비밀번호를 없앴어요"); return; }
if(d.savebase){ const v=Math.max(0,Math.round(Number($("baseInp").value)||0)); const vv=Math.max(0,Math.round(Number($("baseVacInp").value)||0));
const vm=$("vacInp").value.split(/[^0-9]+/).map(Number).filter(n=>n>=1&&n<=12).join(","); b.disabled=true;
await act(call("saveSettings",{settings:{["base_"+curKid()]:v,["baseVac_"+curKid()]:vv,vacMonths:vm}}),"기본 용돈을 저장했어요"); return; }
if(d.saveacct){ const bank=$("bankInp").value.trim().slice(0,20); const no=$("acctInp").value.replace(/[^0-9-]/g,"").slice(0,30); b.disabled=true;
await act(call("saveSettings",{settings:{["bank_"+curKid()]:bank,["acct_"+curKid()]:no}}),"계좌를 저장했어요"); return; }
if(d.copyacct){ const ac=S.config?.accounts?.[d.copyacct]; const t=totals(d.copyacct); const txt=`${ac.bank} ${ac.no} ${t.pay}`;
try{ await navigator.clipboard.writeText(txt); toast("복사했어요: "+txt); }catch(e){ toast(txt); } return; }
if(d.redit){ S.editRule=d.redit; render(); return; }
if(d.rcancel){ S.editRule=null; render(); return; }
if(d.rsave){ const label=$("eLabel").value.trim(); const amt=Math.round(Number($("eAmt").value));
if(!label||!amt){ toast("이름과 금액(0 제외)을 입력해 주세요"); return; }
b.disabled=true; S.editRule=null;
await act(call("saveRule",{kid:curKid(),rule:{id:d.rsave,label,amount:amt,ily:$("eIly").checked,kidOk:$("eKid").checked,photo:$("ePhoto").checked,max:Number($("eMax").value)||0}}),"수정했어요. 지난 기록의 금액은 그대로예요"); return; }
if(d.rdel){ if(!d.sure){ b.textContent="정말 삭제"; b.dataset.sure="1"; return; } b.disabled=true; S.editRule=null;
await act(call("deleteRule",{kid:curKid(),id:d.rdel}),"항목을 삭제했어요. 지난 기록은 남아요"); return; }
if(d.radd){ const label=$("nLabel").value.trim(); const amt=Math.abs(Math.round(Number($("nAmt").value)));
const sign=Number(document.querySelector('input[name="nSign"]:checked').value);
if(!label||!amt){ toast("이름과 금액을 입력해 주세요"); return; } b.disabled=true;
await act(call("saveRule",{kid:curKid(),rule:{label,amount:sign*amt,ily:$("nIly").checked,kidOk:sign>0&&$("nKid").checked,photo:$("nPhoto").checked,max:sign>0?1:0}}),"추가했어요"); return; }
if(d.bsave){ const list=JSON.parse(JSON.stringify(S.config?.bonuses||[])); const x=list.find(z=>z.id===d.bsave); if(!x) return;
const bv=Math.abs(Math.round(Number($("bAmt_"+d.bsave).value)||0)); if(x.type==="weeklyMiss"){ x.amounts=Object.assign({},x.amounts,{[curKid()]:bv}); } else if(x.per) x.per=bv; else x.amount=bv; x.off=!$("bOn_"+d.bsave).checked; b.disabled=true;
await act(call("saveSettings",{settings:{bonuses:list}}),"보너스를 저장했어요"); return; }
});
document.addEventListener("change", async ev => {
const t=ev.target;
if(t.id==="floorChk"){ await act(call("saveSettings",{settings:{floorZero:t.checked}})); return; }
if(t.dataset?.target && t.files?.[0]){
const target=t.dataset.target; toast("사진 올리는 중…");
try{ const data = target==="bg" ? await toJpeg(t.files[0],1100) : await toJpeg(t.files[0],0,null,320);
await call("setPhoto",{target,data}); toast("사진을 바꿨어요"); }catch(e){ onErr(e); }
await refresh(true);
}
});
document.addEventListener("keydown", ev => { if(ev.key==="Escape") closeSheet(); });
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden && S.auth && !sheetOpen()) refresh(true); });
setInterval(()=>{ if(!document.hidden && S.auth && !sheetOpen() && !S.busy) refresh(true); }, 30000);

function applyRestored(d){
if(!d || !d.auth || !d.auth.who) return false;
_set("ycn-auth",d.auth); _set("ycn-ui",d.ui||{}); S.auth=d.auth; const u=d.ui||{};
S.kid=u.kid==="chaewon"?"chaewon":"yunho"; S.mode=u.mode||null; S.self=u.self||null; S.tab=u.tab||"check"; fixMode(); return true;
}
function restoreFromHash(){
return new Promise(res=>{
const g=window.google?.script?.url; if(S.auth || !g){ res(false); return; }
const t=setTimeout(()=>res(false),1500);
try{ g.getLocation(loc=>{ clearTimeout(t); const m=/(?:^|&)u=([^&]+)/.exec(String(loc?.hash||"")); res(m?applyRestored(dec(decodeURIComponent(m[1]))):false); }); }catch(e){ clearTimeout(t); res(false); }
});
}
function restoreFromTop(){
return new Promise(res=>{
if(S.auth || !topOrigin){ res(false); return; }
const t=setTimeout(()=>{ window.removeEventListener("message",on); res(false); },700);
function on(ev){
if(ev.origin!==topOrigin || !ev.data || ev.data.ycn!=="state") return;
clearTimeout(t); window.removeEventListener("message",on);
res(applyRestored(ev.data.data||{}));
}
window.addEventListener("message",on);
try{ window.top.postMessage({ycn:"load"}, topOrigin); }catch(e){ clearTimeout(t); res(false); }
});
}
/* 화면 가장자리: 바깥 페이지(github.io)가 알려주는 상태바·홈 바 높이만큼만 비워요. */
(function(){ const st=document.createElement("style"); st.textContent=`
:root{--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--clip:0px}
body{padding-top:max(4px,var(--sat))!important;padding-bottom:calc(72px + var(--sab) + var(--clip))!important}
.tabs{padding-bottom:calc(6px + var(--sab))!important;bottom:var(--clip)!important}
.sheet{padding-bottom:calc(18px + var(--sab))!important}
.toast{bottom:calc(84px + var(--sab))!important}
/* 아이폰은 16px보다 작은 입력칸을 누르면 화면을 확대해서 글자가 잘려 보여요. */
input,select,textarea{font-size:16px!important}`; document.head.appendChild(st);
window.addEventListener("message",ev=>{ if(ev.origin!==topOrigin||!ev.data||ev.data.ycn!=="insets") return;
const r=document.documentElement.style; r.setProperty("--sat",(Number(ev.data.top)||0)+"px"); r.setProperty("--sab",(Number(ev.data.bottom)||0)+"px");
/* 아이폰은 안쪽 화면을 바깥 틀보다 길게 잡을 때가 있어요. 그 차이만큼 탭바를 올려서 가려지지 않게 해요. */
const fh=Number(ev.data.frameH)||0; r.setProperty("--clip",(fh>0?Math.max(0,Math.round(window.innerHeight-fh)):0)+"px"); });
/* 홈 화면 앱(github.io) 안에서는 아이폰이 화면 맨 아래 칸을 가리거나 누르지 못하게 할 때가 있어요.
   그래서 탭바는 아래에 두되 그 칸보다 위에 둥글게 띄우고, 팝업은 화면 가운데에 띄워요. */
if(topOrigin){
document.documentElement.classList.add("emb");
const st2=document.createElement("style"); st2.textContent=`
.emb{--lift:calc(8px + max(var(--sat), var(--sab)))}
.emb body{padding-bottom:calc(96px + var(--lift))!important}
.emb .tabs{left:12px!important;right:12px!important;bottom:var(--lift)!important;border:1px solid var(--line)!important;
 border-radius:22px!important;padding:6px 8px!important;box-shadow:0 6px 24px rgba(20,30,50,.18)}
.emb .scrim{align-items:center!important;padding:16px}
.emb .sheet{border-radius:18px!important;padding-bottom:18px!important;max-height:80vh}
.emb .toast{bottom:calc(84px + var(--lift))!important}`; document.head.appendChild(st2);
} })();
render();
if(topOrigin){ try{ window.top.postMessage({ycn:"hello"}, topOrigin); }catch(e){} }
restoreFromTop().then(a=>a||restoreFromHash()).then(got=>{ boot(); if(S.auth){ $("loginArea").hidden=true; $("loginArea").innerHTML=""; if(got) render(); refresh(); hashSave(); } });
})();

</script>
</body>
