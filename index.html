<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>윤호, 채원이네</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="윤호채원">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#10141b">
<link rel="apple-touch-icon" href="icon.jpg?v=2">
<link rel="icon" type="image/jpeg" href="icon.jpg?v=2">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html, body { margin: 0; height: 100%; background: #10141b; overflow: hidden; }
  body { padding-top: env(safe-area-inset-top, 0px); box-sizing: border-box; }
  iframe { display: block; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<iframe src="https://script.google.com/macros/s/AKfycbzhbaZtMcPyhMlsOBEt1cqps72dyTTdhso3vsjWXAA69xLrck1xABlOnCCfZMnQRISg/exec"
        title="윤호, 채원이네" allow="camera; clipboard-write"></iframe>
<script>
/* 로그인 기억: 아이폰은 안쪽 구글 화면의 저장 공간을 앱을 닫을 때 지워요.
   앱이 로그인 정보를 이 페이지에 맡기면 여기 저장해 두었다가, 다음에 열 때 돌려줘요. */
window.addEventListener("message", function (e) {
  var host = "";
  try { host = new URL(e.origin).hostname; } catch (x) { return; }
  if (!/\.googleusercontent\.com$/.test(host)) return;
  var m = e.data;
  if (!m || !m.ycn) return;
  if (m.ycn === "save") { try { localStorage.setItem("ycn-store", JSON.stringify(m.data || {})); } catch (x) {} }
  if (m.ycn === "load") {
    var d = null; try { d = JSON.parse(localStorage.getItem("ycn-store") || "null"); } catch (x) {}
    e.source.postMessage({ ycn: "state", data: d }, e.origin);
  }
});
</script>
</body>
</html>
